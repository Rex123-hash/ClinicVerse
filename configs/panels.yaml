# Co-measured analyte groups ("panel-like subsets") and relative cost regimes.
#
# NAMING CAVEAT — these are NOT recorded laboratory orders.
# PhysioNet 2012 records analytes with timestamps; it does not record what was
# ordered. The groups below are co-measurement clusters that resemble familiar
# clinical panels, so they are named "*-like" and must be described that way.
# Do not write "BMP", "the CBC panel", or "laboratory orders" in prose or UI.
#
# PROVENANCE — membership is EMPIRICALLY DERIVED, not assumed.
# experiments/baselines/derive_panels.py clusters the 23 laboratory analytes on
# co-measurement Jaccard distance across 86,559 co-timestamped events in sets
# a+b, with no clinical panel definitions supplied. At Jaccard distance 0.35 the
# clustering yields the groups below. See docs/EXPERIMENTS.md E-001.
#
# COST IS A MODELING ASSUMPTION, NOT DATA.
# PhysioNet 2012 contains no prices. All costs are DIMENSIONLESS RELATIVE UNITS.
# No monetary figure is used or implied. Every headline result must be reported
# under all four regimes below; a conclusion that holds only under one regime is
# a conclusion about that regime. See docs/LIMITATIONS.md 4.

version: "2.0"
derived_from:
  script: experiments/baselines/derive_panels.py
  sets: [a, b]
  n_co_timestamped_events: 86559
  jaccard_distance_threshold: 0.35

# Default regime is `shared_plus_marginal` (see alternative_schedules); the
# per-panel `cost` below instantiates it.
default_regime: shared_plus_marginal

panels:
  BMP_like:
    label: BMP-like co-measured subset
    members: [BUN, Creatinine, Glucose, HCO3, K, Mg, Na]
    cost: 1.7
    within_panel_jaccard: 0.861
    tier: routine

  CBC_like:
    label: CBC-like co-measured subset
    members: [HCT, Platelets, WBC]
    cost: 1.3
    within_panel_jaccard: 0.782
    tier: routine

  hepatic_like:
    label: Hepatic-like co-measured subset
    members: [ALP, ALT, AST, Bilirubin]
    cost: 1.4
    within_panel_jaccard: 0.934
    tier: targeted

  ABG_like:
    label: ABG-like co-measured subset
    members: [PaCO2, PaO2, pH]
    cost: 1.3
    within_panel_jaccard: 0.969
    tier: routine

  # --- singleton sends -------------------------------------------------------
  # Each separated from every cluster at the derivation threshold, i.e. these are
  # genuinely measured on their own in this dataset. Notably SaO2 did NOT group
  # with the ABG-like subset despite being an oxygenation measure (marginal draw
  # frequency 0.176 vs 0.536 for pH), so assuming it belonged there on clinical
  # intuition would have been wrong. Albumin likewise separated from the
  # hepatic-like subset.
  Lactate:
    label: Lactate
    members: [Lactate]
    cost: 1.1
    tier: targeted
  SaO2:
    label: Arterial oxygen saturation
    members: [SaO2]
    cost: 1.1
    tier: routine
  Albumin:
    label: Albumin
    members: [Albumin]
    cost: 1.1
    tier: targeted
  TroponinT:
    label: Troponin T
    members: [TroponinT]
    cost: 1.1
    tier: specialised
  TroponinI:
    label: Troponin I
    members: [TroponinI]
    cost: 1.1
    tier: specialised
  Cholesterol:
    label: Cholesterol
    members: [Cholesterol]
    cost: 1.1
    tier: specialised

# --------------------------------------------------------------------------
# Cost regimes. Policy rankings are tested for sensitivity across ALL of these.
# If rankings change materially between regimes, that is a headline result.
alternative_schedules:
  uniform_event:
    description: Every acquisition event costs the same regardless of how many
      analytes it returns. Isolates the effect of grouping from pricing.
    costs: {BMP_like: 1.0, CBC_like: 1.0, hepatic_like: 1.0, ABG_like: 1.0,
            Lactate: 1.0, SaO2: 1.0, Albumin: 1.0, TroponinT: 1.0,
            TroponinI: 1.0, Cholesterol: 1.0}

  shared_plus_marginal:
    description: A shared per-event cost of 1.0 plus a marginal 0.1 per analyte
      returned. Reflects that a draw has fixed overhead and each assay adds a
      little. This is the default regime.
    costs: {BMP_like: 1.7, CBC_like: 1.3, hepatic_like: 1.4, ABG_like: 1.3,
            Lactate: 1.1, SaO2: 1.1, Albumin: 1.1, TroponinT: 1.1,
            TroponinI: 1.1, Cholesterol: 1.1}

  ordinal_tier:
    description: Ordinal tiers by how routinely each group is measured in this
      dataset - routine 1, targeted 2, specialised 3. Avoids any pretence of
      cardinal pricing.
    costs: {BMP_like: 1.0, CBC_like: 1.0, ABG_like: 1.0, SaO2: 1.0,
            hepatic_like: 2.0, Lactate: 2.0, Albumin: 2.0,
            TroponinT: 3.0, TroponinI: 3.0, Cholesterol: 3.0}

  per_analyte:
    description: Cost proportional to the number of analytes returned - the
      implicit assumption of feature-level acquisition. Included because it is
      the comparison that tests whether grouping matters at all.
    costs: {BMP_like: 7.0, CBC_like: 3.0, hepatic_like: 4.0, ABG_like: 3.0,
            Lactate: 1.0, SaO2: 1.0, Albumin: 1.0, TroponinT: 1.0,
            TroponinI: 1.0, Cholesterol: 1.0}
