[project]
name = "cliniverse"
version = "0.1.0"
description = "Benchmark and evaluation harness for cost-aware, panel-level observation acquisition under incomplete longitudinal patient data"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
figures = [
    "matplotlib>=3.8",
]
models = [
    "xgboost>=2.1",
    "lightgbm>=4.3",
    "torch>=2.2",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-pyyaml",
]

[project.scripts]
cliniverse = "cliniverse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cliniverse", "twinbench"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 95
target-version = "py312"
src = ["cliniverse", "twinbench", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "S",         # bandit (security)
    "ANN",       # annotations
]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation
    "S101",    # assert is fine in tests (further relaxed below)
]

[tool.ruff.lint.isort]
known-first-party = ["cliniverse", "twinbench"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "E501"]
"scripts/*" = ["S310"]  # urllib with a fixed https host

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "lightgbm.*", "sklearn.*", "scipy.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires the full dataset download or long compute",
    "integration: end-to-end across modules",
]
filterwarnings = ["error::DeprecationWarning:cliniverse.*"]
